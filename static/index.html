<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveShare &bull; P2P File Transfer</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Top Header -->
  <header>
    <a href="/" class="logo-area" id="logo-btn">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-4-4 4 4 4-4"/>
        </svg>
      </div>
      <div class="logo-text">LiveShare <span class="badge-tag">P2P</span></div>
    </a>
  </header>

  <!-- Main Container -->
  <main>
    
    <!-- Tab Switcher -->
    <div class="tabs-container">
      <div class="tab-nav">
        <button class="tab-btn active" id="tab-send-btn">Send</button>
        <button class="tab-btn" id="tab-receive-btn">Receive</button>
      </div>
    </div>

    <!-- ==================== SEND SECTION ==================== -->
    <section id="send-section" class="tab-content active">
      
      <!-- Sender Config Card -->
      <div class="card glass" id="sender-config-card">
        
        <!-- Native File Dropzone -->
        <input type="file" id="file-input" class="file-input-hidden" multiple>
        <label class="dropzone" id="dropzone" for="file-input">
          <div class="dropzone-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <span class="dropzone-title">Click to select files or drop here</span>
        </label>

        <!-- Selected Files List -->
        <div id="file-list" class="file-list-container"></div>

        <!-- Room & Password Config -->
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="send-room-code">Room Code</label>
            <div class="input-container">
              <input type="text" id="send-room-code" class="form-input" placeholder="e.g. SKY-742" autocomplete="off" style="text-transform: uppercase;">
              <button type="button" class="btn-generate" id="btn-gen-code">New</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="send-password">Set Password</label>
            <div class="input-container">
              <input type="password" id="send-password" class="form-input" placeholder="Required for receiver" autocomplete="new-password">
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="btn-start-share" disabled style="margin-top: 1.5rem;">
          Start Sharing
        </button>
      </div>

      <!-- Sender Active Live Session -->
      <div class="card glass session-card" id="sender-active-session" style="display: none;">
        <div class="session-header">
          <div>
            <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Share Code</span>
            <div class="room-code-val" id="display-room-code">---</div>
          </div>
          
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary btn-sm" id="btn-copy-code" title="Copy Code">Copy Code</button>
            <button class="btn btn-secondary btn-sm" id="btn-copy-link" title="Copy Link">Copy Link</button>
            <button class="btn btn-secondary btn-sm" id="btn-show-qr" title="QR Code">QR</button>
          </div>
        </div>

        <div class="peer-status-pill" id="sender-peer-status">
          <div class="pulse-ring waiting"></div>
          <span class="status-text">Waiting for receiver to connect...</span>
        </div>

        <!-- Sender Transfer Progress -->
        <div class="transfer-progress-box" id="sender-transfer-progress" style="display: none;">
          <div class="progress-header">
            <span id="sender-transfer-file" style="font-weight: 600; font-size: 0.9rem;">Sending...</span>
            <span id="sender-progress-percent" style="font-weight: 700; color: var(--accent-cyan);">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="sender-progress-fill"></div>
          </div>
          <div class="progress-stats" id="sender-progress-stats">
            <span>0 KB / 0 KB</span>
            <span>0 KB/s</span>
          </div>
        </div>

        <button class="btn btn-danger btn-block" id="btn-stop-share">
          End Session
        </button>
      </div>

    </section>

    <!-- ==================== RECEIVE SECTION ==================== -->
    <section id="receive-section" class="tab-content">
      
      <!-- Receiver Config Card -->
      <div class="card glass" id="receiver-config-card">
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="receive-room-code">Room Code</label>
            <div class="input-container">
              <input type="text" id="receive-room-code" class="form-input" placeholder="e.g. SKY-742" style="text-transform: uppercase;">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="receive-password">Password</label>
            <div class="input-container">
              <input type="password" id="receive-password" class="form-input" placeholder="Enter password">
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="btn-connect-receive" style="margin-top: 1.5rem;">
          Connect &amp; Download
        </button>
      </div>

      <!-- Receiver Active Session -->
      <div class="card glass session-card" id="receiver-active-session" style="display: none;">
        <div class="session-header">
          <h3 style="font-size: 1.1rem; font-weight: 600;">Direct Transfer</h3>
          <div class="peer-status-pill" id="receiver-peer-status">
            <div class="pulse-ring waiting"></div>
            <span class="status-text">Connecting...</span>
          </div>
        </div>

        <!-- Offered Files Manifest -->
        <div id="receiver-file-manifest" class="file-list-container"></div>

        <!-- Receiver Transfer Progress -->
        <div class="transfer-progress-box" id="receiver-transfer-progress" style="display: none;">
          <div class="progress-header">
            <span id="receiver-transfer-file" style="font-weight: 600; font-size: 0.9rem;">Receiving...</span>
            <span id="receiver-progress-percent" style="font-weight: 700; color: var(--accent-cyan);">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="receiver-progress-fill"></div>
          </div>
          <div class="progress-stats" id="receiver-progress-stats">
            <span>0 KB / 0 KB</span>
            <span>0 KB/s</span>
          </div>
        </div>

        <!-- Completed Downloads List -->
        <div id="received-downloads-list" class="file-list-container"></div>

        <button class="btn btn-secondary btn-block" id="btn-leave-receive">
          Disconnect
        </button>
      </div>

    </section>

  </main>

  <!-- QR Code Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-card">
      <button class="modal-close" id="btn-close-qr">&times;</button>
      <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem;">Scan to Join</h3>
      <p id="qr-room-text" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem;"></p>
      <div class="qr-canvas-container" id="qr-code-canvas"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/webrtc.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
